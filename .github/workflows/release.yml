name: Release

# Triggered by `npm run release -- patch|minor|major`, which pushes a vX.Y.Z tag.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches manifest version
        run: |
          V=$(node -p "require('./public/manifest.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $V"; exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - run: npm run build:all
      - name: Package
        run: |
          mkdir -p release
          (cd dist && zip -qr "../release/chrome.zip" .)
          (cd dist-firefox && zip -qr "../release/firefox.zip" .)
          git archive --format=zip -o release/source.zip HEAD
          cp amo-metadata.json release/
      - name: Release notes from commits since the previous tag
        run: |
          PREV=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log ${PREV:+$PREV..}"$GITHUB_REF_NAME" --no-merges --pretty='- %s' \
            | grep -v '^- Release v' > release/NOTES.md || true
          [ -s release/NOTES.md ] || echo '- Bug fixes and improvements' > release/NOTES.md
          cat release/NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp release/chrome.zip "mindstack-chrome-$VERSION.zip"
          cp release/firefox.zip "mindstack-firefox-$VERSION.zip"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release/NOTES.md \
            "mindstack-chrome-$VERSION.zip" "mindstack-firefox-$VERSION.zip"

  chrome:
    needs: package
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - if: env.REFRESH_TOKEN == ''
        run: echo "::warning::Chrome Web Store secrets not configured - skipping Chrome publish"
      - if: env.REFRESH_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.REFRESH_TOKEN != ''
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: env.REFRESH_TOKEN != ''
        run: npm ci
      - if: env.REFRESH_TOKEN != ''
        uses: actions/download-artifact@v4
        with: { name: release, path: release }
      - name: Upload and publish to Chrome Web Store
        if: env.REFRESH_TOKEN != ''
        run: npx chrome-webstore-upload --source release/chrome.zip

  edge:
    needs: package
    runs-on: ubuntu-latest
    env:
      EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
      EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
      EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
    steps:
      - if: env.EDGE_API_KEY == ''
        run: echo "::warning::Edge Add-ons secrets not configured - skipping Edge publish"
      - if: env.EDGE_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.EDGE_API_KEY != ''
        uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: env.EDGE_API_KEY != ''
        uses: actions/download-artifact@v4
        with: { name: release, path: release }
      - name: Upload and submit to Edge Add-ons
        if: env.EDGE_API_KEY != ''
        run: node scripts/publish-edge.mjs release/chrome.zip "$(cat release/NOTES.md)"

  firefox:
    needs: package
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - if: env.AMO_JWT_SECRET == ''
        run: echo "::warning::Firefox (AMO) secrets not configured - skipping Firefox publish"
      - if: env.AMO_JWT_SECRET != ''
        uses: actions/checkout@v4
      - if: env.AMO_JWT_SECRET != ''
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: env.AMO_JWT_SECRET != ''
        run: npm ci
      - if: env.AMO_JWT_SECRET != ''
        uses: actions/download-artifact@v4
        with: { name: release, path: release }
      - name: Submit to addons.mozilla.org
        if: env.AMO_JWT_SECRET != ''
        run: |
          mkdir -p ff && (cd ff && unzip -q ../release/firefox.zip)
          jq --rawfile n release/NOTES.md '.version.release_notes = {"en-US": $n}' \
            release/amo-metadata.json > release/amo-metadata.final.json
          npx web-ext sign --channel listed --source-dir ff \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" \
            --upload-source-code release/source.zip \
            --amo-metadata release/amo-metadata.final.json \
            --approval-timeout 0
