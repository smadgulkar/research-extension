<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mindstack: store dashboard</title>
<style>
  :root {
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
    --chrome:#2a78d6; --firefox:#eb6834; --edge:#1baf7a;
    --good:#006300; --bad:#b3261e; --warn-bg:#fff4e5; --warn-ink:#6b3d00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
      --chrome:#3987e5; --firefox:#d95926; --edge:#199e70;
      --good:#0ca30c; --bad:#ff8a80; --warn-bg:#3a2a12; --warn-ink:#ffd59e;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:28px 24px 60px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  h1 { font-size:22px; margin:0; }
  h2 { font-size:16px; margin:0 0 12px; }
  .sub { color:var(--ink-2); font-size:13px; }
  .card { background:var(--surface); border:1px solid var(--ring); border-radius:14px; padding:18px 20px; }
  .stores { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:16px; }
  .store h2 { display:flex; align-items:center; gap:8px; }
  .swatch { width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; }
  .hero { font-size:40px; font-weight:700; letter-spacing:-0.02em; line-height:1.1; margin:6px 0 2px; font-variant-numeric:tabular-nums; }
  .hero small { font-size:15px; font-weight:500; color:var(--ink-2); letter-spacing:0; }
  .note { color:var(--muted); font-size:12px; }
  .delta-up { color:var(--good); } .delta-down { color:var(--bad); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:12px 0 0; font-size:13px; }
  dt { color:var(--ink-2); } dd { margin:0; font-variant-numeric:tabular-nums; }
  .pending { display:inline-flex; gap:6px; align-items:center; background:var(--warn-bg); color:var(--warn-ink); padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; }
  .banner { background:var(--warn-bg); color:var(--warn-ink); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:14px; }
  .chart-head { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .legend { display:flex; gap:16px; font-size:13px; color:var(--ink-2); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  button.toggle { background:none; border:1px solid var(--ring); color:var(--ink); border-radius:8px; padding:4px 10px; font:inherit; font-size:13px; cursor:pointer; }
  .chart-wrap { position:relative; }
  svg { display:block; width:100%; height:auto; overflow:visible; }
  .tip { position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--ring); border-radius:8px; padding:8px 10px; font-size:12px; box-shadow:0 6px 18px rgba(0,0,0,.12); min-width:170px; display:none; }
  .tip b { display:block; margin-bottom:4px; }
  .tip div { display:flex; align-items:center; gap:6px; justify-content:space-between; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--grid); }
  th { color:var(--ink-2); font-weight:600; }
  .grid2 { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-top:16px; }
  ul.tasks { list-style:none; margin:0; padding:0; }
  ul.tasks li { border-bottom:1px solid var(--grid); padding:10px 0; }
  ul.tasks li:last-child { border-bottom:0; }
  .task-title { display:flex; gap:8px; align-items:flex-start; font-weight:600; }
  .check { flex:none; width:18px; height:18px; border-radius:5px; border:1.5px solid var(--axis); display:inline-flex; align-items:center; justify-content:center; font-size:12px; margin-top:2px; }
  .done .check { background:var(--good); border-color:var(--good); color:#fff; }
  .done .task-title span.t { color:var(--muted); text-decoration:line-through; }
  details { margin:4px 0 0 26px; font-size:13px; color:var(--ink-2); }
  details ol { margin:6px 0 0; padding-left:18px; }
  .tag { font-size:11px; font-weight:500; color:var(--muted); margin-left:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--ring); }
  a { color:var(--chrome); }
  @media (max-width: 860px) { .stores, .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = /*__DATA__*/null;

const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const fmtN = (v) => (v == null ? 'n/a' : Number(v).toLocaleString());
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---------- series ----------
// Chrome: exact CSV points win; otherwise the store page's rounded figure.
function buildSeries() {
  const chrome = new Map();
  for (const h of DATA.history) if (h.chrome?.usersShown != null && !h.chrome.stale) chrome.set(h.date, { v: h.chrome.usersShown, src: 'store page (rounded)' });
  // Exact CSV values replace rounded ones. Rounded store figures are kept only for
  // dates after the CSV ends, so the two sources never mix into a fake jump.
  const csvDates = Object.keys(DATA.chromeCsv || {}).sort();
  if (csvDates.length) {
    const lastCsv = csvDates.at(-1);
    for (const d of [...chrome.keys()]) if (d <= lastCsv) chrome.delete(d);
    for (const d of csvDates) chrome.set(d, { v: DATA.chromeCsv[d], src: 'dashboard CSV (exact)', exact: true });
  }
  const firefox = new Map();
  for (const h of DATA.history) if (h.firefox?.users != null && !h.firefox.stale) firefox.set(h.date, { v: h.firefox.users, src: 'AMO daily users' });
  const edge = new Map();
  for (const h of DATA.history) if (h.edge?.listed && h.edge.usersShown != null) edge.set(h.date, { v: h.edge.usersShown, src: 'store page' });
  const toArr = (m) => [...m.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([d, o]) => ({ d, t: Date.parse(d), ...o }));
  return [
    { key:'chrome', name:'Chrome', color:'--chrome', pts: toArr(chrome) },
    { key:'firefox', name:'Firefox', color:'--firefox', pts: toArr(firefox) },
    { key:'edge', name:'Edge', color:'--edge', pts: toArr(edge) },
  ].filter((s) => s.pts.length);
}

function deltaVs(allPts, days) {
  const lastSrc = allPts.at(-1)?.src;
  const pts = allPts.filter((p) => p.src === lastSrc); // compare like with like
  if (pts.length < 2) return null;
  const last = pts[pts.length - 1];
  const target = last.t - days * 864e5;
  const base = [...pts].reverse().find((p) => p.t <= target);
  return base ? { diff: last.v - base.v, since: base.d } : null;
}
const deltaHtml = (d) => !d ? '<span class="note">No earlier data yet</span>'
  : `<span class="${d.diff >= 0 ? 'delta-up' : 'delta-down'}">${d.diff >= 0 ? '▲' : '▼'} ${fmtN(Math.abs(d.diff))}</span> <span class="note">since ${d.since}</span>`;

// ---------- render ----------
function render() {
  const L = DATA.latest, series = buildSeries();
  const sOf = (k) => series.find((s) => s.key === k);
  const chromeS = sOf('chrome'), ffS = sOf('firefox');
  // Prefer the latest exact (CSV) value if it is recent; otherwise the rounded store figure.
  const lastExact = chromeS?.pts.filter((p) => p.exact).at(-1);
  const chromeLast = lastExact && (Date.now() - lastExact.t) <= 14 * 864e5 ? lastExact : chromeS?.pts.at(-1);
  const chromeDeltaPts = chromeS ? chromeS.pts.filter((p) => p.src === chromeLast?.src) : null;
  const errs = Object.entries(DATA.errors || {});
  const app = document.getElementById('app');

  const ratingText = (r, n) => (n ? `${r.toFixed(1)} ★ <span class="note">(${n} rating${n === 1 ? '' : 's'})</span>` : '<span class="note">No ratings yet</span>');

  app.append($(`
    <header>
      <div><h1>Mindstack: store dashboard</h1>
      <div class="sub">Updated ${new Date(DATA.generatedAt).toLocaleString()} · history: ${DATA.history.length} day${DATA.history.length === 1 ? '' : 's'} · run <code>npm run dashboard</code> to refresh</div></div>
      <div class="chips">${['CWS', 'AMO', 'EDGE'].map((p) => {
        const names = { CWS:'Chrome publishing', AMO:'Firefox publishing', EDGE:'Edge publishing' };
        const ok = DATA.secrets ? DATA.secrets.some((s) => s.startsWith(p + '_')) : null;
        return `<span class="chip">${ok === null ? '?' : ok ? '✓' : '✗'} ${names[p]}${ok === null ? ' (gh unavailable)' : ok ? '' : ': secrets missing'}</span>`;
      }).join('')}</div>
    </header>
    ${errs.length ? `<div class="banner">⚠ Couldn't refresh: ${errs.map(([k, v]) => `<b>${esc(k)}</b> (${esc(v)})`).join('; ')}. Showing the last known values.</div>` : ''}
    <section class="stores">
      <div class="card store">
        <h2><span class="swatch" style="background:var(--chrome)"></span>Chrome Web Store</h2>
        <div class="hero">${fmtN(chromeLast?.v)} <small>${chromeLast?.src?.includes('exact') ? 'weekly users' : 'users'}</small></div>
        <div class="note">${chromeLast?.src?.includes('exact') ? `Exact, from dashboard CSV (${chromeLast.d})` : 'Rounded by Google on the store page. For exact numbers, export the Users CSV into dashboard/data/chrome-csv/'}</div>
        <div style="margin-top:6px">${deltaHtml(chromeDeltaPts && deltaVs(chromeDeltaPts, 7))}</div>
        <dl>
          <dt>Rating</dt><dd>${L.chrome ? ratingText(L.chrome.rating, L.chrome.ratingCount) : 'n/a'}</dd>
          <dt>Live version</dt><dd>${esc(L.chrome?.version ?? 'n/a')}${L.chrome?.updated ? ` <span class="note">updated ${esc(L.chrome.updated)}</span>` : ''}</dd>
          ${(() => {
            const v = DATA.chromeVersions; if (!v) return '';
            const entries = Object.entries(v.byVersion).filter(([, n]) => n > 0)
              .sort((a, b) => b[0].localeCompare(a[0], undefined, { numeric: true }));
            const total = entries.reduce((s, [, n]) => s + n, 0); if (!total) return '';
            return `<dt>Version adoption</dt><dd>${entries.map(([ver, n]) => `${esc(ver.replace(/\.0$/, ''))}: ${Math.round(n / total * 100)}%`).join(' · ')} <span class="note">daily users, ${v.date}</span></dd>`;
          })()}
          <dt>Listing</dt><dd><a href="${DATA.links.chrome}">Open store page</a></dd>
        </dl>
      </div>
      <div class="card store">
        <h2><span class="swatch" style="background:var(--firefox)"></span>Firefox Add-ons</h2>
        <div class="hero">${fmtN(L.firefox?.users)} <small>daily users</small></div>
        <div class="note">Exact, from Mozilla's API (average daily users)</div>
        <div style="margin-top:6px">${deltaHtml(ffS && deltaVs(ffS.pts, 7))}</div>
        <dl>
          <dt>Downloads</dt><dd>${fmtN(L.firefox?.weeklyDownloads)} <span class="note">last 7 days</span></dd>
          <dt>Rating</dt><dd>${L.firefox ? ratingText(L.firefox.rating, L.firefox.ratingCount) : 'n/a'}</dd>
          <dt>Live version</dt><dd>${esc(L.firefox?.version ?? 'n/a')} <span class="note">${esc(L.firefox?.status ?? '')}</span></dd>
          <dt>Screenshots</dt><dd>${L.firefox ? (L.firefox.screenshots || '<span class="delta-down">none</span>') : 'n/a'}</dd>
          <dt>Listing</dt><dd><a href="${DATA.links.firefox}">Open store page</a></dd>
        </dl>
      </div>
      <div class="card store">
        <h2><span class="swatch" style="background:var(--edge)"></span>Microsoft Edge Add-ons</h2>
        ${L.edge?.listed
          ? `<div class="hero">${fmtN(L.edge.usersShown)} <small>users</small></div><dl><dt>Live version</dt><dd>${esc(L.edge.version ?? 'n/a')}</dd><dt>Listing</dt><dd><a href="${DATA.links.edge}">Open store page</a></dd></dl>`
          : `<div style="margin:14px 0 8px"><span class="pending">⏳ Pending: not listed yet</span></div>
             <div class="note">Edge users can already install from the Chrome Web Store. A native Edge listing adds discovery in Microsoft's store. See the tasks below.</div>`}
      </div>
    </section>

    <section class="card">
      <div class="chart-head">
        <h2 style="margin:0">Users over time</h2>
        <div style="display:flex; gap:14px; align-items:center">
          <div class="legend">${series.map((s) => `<span><span class="swatch" style="background:var(${s.color})"></span>${s.name}</span>`).join('')}</div>
          <button class="toggle" id="tbl-toggle" aria-pressed="false">Table view</button>
        </div>
      </div>
      <div class="chart-wrap" id="chart"></div>
      <div id="table" hidden></div>
      <div class="note" style="margin-top:6px">Chrome = weekly users: solid = exact (dashboard CSV), dashed = rounded store-page figure after the last CSV · Firefox = average daily users. One snapshot per day each time you run the dashboard.</div>
    </section>

    <section class="grid2">
      <div class="card">
        <h2>Pending tasks <span class="note">(${DATA.tasks.filter((t) => !t.done).length} open)</span></h2>
        <ul class="tasks">${DATA.tasks.map((t) => `
          <li class="${t.done ? 'done' : ''}">
            <div class="task-title"><span class="check" aria-label="${t.done ? 'done' : 'not done'}">${t.done ? '✓' : ''}</span><span class="t">${esc(t.title)}</span>
              <span class="tag">${t.autoChecked ? 'auto-checked' : 'mark done in dashboard/data/tasks.json'}</span></div>
            ${t.done ? '' : `<details><summary>Steps</summary><ol>${t.steps.map((s) => `<li>${esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1">$1</a>')}</li>`).join('')}</ol>${t.auto ? `<div class="note" style="margin-top:6px">${esc(t.auto)}</div>` : ''}</details>`}
          </li>`).join('')}</ul>
      </div>
      <div class="card">
        <h2>Chrome CSV import</h2>
        <p class="sub" style="margin-top:0">For exact weekly users: Chrome dashboard → Mindstack → <b>Analytics → Users</b> → export CSV, then save it into the repo's <code>data/</code> folder (or <code>dashboard/data/chrome-csv/</code>) and re-run. The "Weekly users over time" and "Daily users by item version" files are used.</p>
        <div class="note">${DATA.chromeCsvFiles.length ? `Loaded ${DATA.chromeCsvFiles.length} file(s), ${Object.keys(DATA.chromeCsv).length} dated points: ${DATA.chromeCsvFiles.map(esc).join(', ')}` : 'No CSV loaded yet.'}</div>
        ${DATA.chromeCsvFiles.length && !Object.keys(DATA.chromeCsv).length ? '<div class="banner" style="margin-top:10px">CSV found but no rows could be read. The column names may differ from what the parser expects.</div>' : ''}
      </div>
    </section>
  `));

  drawChart(series);
  drawTable(series);
  const btn = document.getElementById('tbl-toggle');
  btn.onclick = () => {
    const show = document.getElementById('table').hidden;
    document.getElementById('table').hidden = !show;
    document.getElementById('chart').hidden = show;
    btn.textContent = show ? 'Chart view' : 'Table view';
    btn.setAttribute('aria-pressed', String(show));
  };
}

function niceMax(v) {
  if (v <= 5) return 5;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p;
  return 10 * p;
}

function drawChart(series) {
  const host = document.getElementById('chart');
  const W = 1000, H = 300, m = { t: 16, r: 120, b: 30, l: 44 };
  const all = series.flatMap((s) => s.pts);
  if (!all.length) { host.innerHTML = '<p class="note">No data yet.</p>'; return; }
  let t0 = Math.min(...all.map((p) => p.t)), t1 = Math.max(...all.map((p) => p.t));
  if (t0 === t1) { t0 -= 3 * 864e5; t1 += 3 * 864e5; }
  const yMax = niceMax(Math.max(...all.map((p) => p.v), 1));
  const x = (t) => m.l + ((t - t0) / (t1 - t0)) * (W - m.l - m.r);
  const y = (v) => H - m.b - (v / yMax) * (H - m.t - m.b);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * yMax);
  const nX = Math.min(6, Math.max(2, Math.round((t1 - t0) / 864e5)));
  const xTicks = Array.from({ length: nX + 1 }, (_, i) => t0 + (i / nX) * (t1 - t0));
  const dfmt = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', timeZone: 'UTC' });

  // Direct labels at line ends; nudge apart if they collide.
  const ends = series.map((s) => ({ s, p: s.pts.at(-1), yy: y(s.pts.at(-1).v) })).sort((a, b) => a.yy - b.yy);
  for (let i = 1; i < ends.length; i++) if (ends[i].yy - ends[i - 1].yy < 16) ends[i].yy = ends[i - 1].yy + 16;

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Users over time by store">`;
  for (const v of ticks) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(${v === 0 ? '--axis' : '--grid'})" stroke-width="1"/>
    <text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(Math.round(v))}</text>`;
  for (const t of xTicks) svg += `<text x="${x(t)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${dfmt(t)}</text>`;
  for (const s of series) {
    const path = (pts) => pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
    const firstRounded = s.pts.some((p) => p.exact) ? s.pts.findIndex((p) => !p.exact) : -1;
    const solid = firstRounded === -1 ? s.pts : s.pts.slice(0, firstRounded);
    const dashed = firstRounded === -1 ? [] : s.pts.slice(Math.max(0, firstRounded - 1));
    if (solid.length > 1) svg += `<path d="${path(solid)}" fill="none" stroke="var(${s.color})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (dashed.length > 1) svg += `<path d="${path(dashed)}" fill="none" stroke="var(${s.color})" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"><title>Rounded store-page figures (after the last CSV export)</title></path>`;
    const last = s.pts.at(-1);
    svg += `<circle cx="${x(last.t)}" cy="${y(last.v)}" r="4.5" fill="var(${s.color})" stroke="var(--surface)" stroke-width="2"/>`;
  }
  for (const e of ends) svg += `<rect x="${x(e.p.t) + 10}" y="${e.yy - 5}" width="8" height="8" rx="2" fill="var(${e.s.color})"/>
    <text x="${x(e.p.t) + 22}" y="${e.yy + 3}" font-size="12" fill="var(--ink)">${e.s.name} <tspan fill="var(--ink-2)">${fmtN(e.p.v)}</tspan></text>`;
  svg += `<line id="xh" y1="${m.t}" y2="${H - m.b}" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>
    <g id="hover-dots"></g>
    <rect id="hit" x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/></svg>`;
  host.innerHTML = svg + '<div class="tip" id="tip"></div>';

  // Crosshair + tooltip: snap to the nearest date that has any data.
  const dates = [...new Set(all.map((p) => p.t))].sort((a, b) => a - b);
  const svgEl = host.querySelector('svg'), tip = host.querySelector('#tip'), xh = host.querySelector('#xh'), dots = host.querySelector('#hover-dots');
  host.querySelector('#hit').addEventListener('mousemove', (ev) => {
    const r = svgEl.getBoundingClientRect(), sx = W / r.width;
    const px = (ev.clientX - r.left) * sx;
    const t = dates.reduce((a, b) => (Math.abs(x(b) - px) < Math.abs(x(a) - px) ? b : a));
    xh.setAttribute('x1', x(t)); xh.setAttribute('x2', x(t)); xh.setAttribute('visibility', 'visible');
    const rows = series.map((s) => ({ s, p: s.pts.find((p) => p.t === t) })).filter((r) => r.p);
    dots.innerHTML = rows.map(({ s, p }) => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="5" fill="var(${s.color})" stroke="var(--surface)" stroke-width="2"/>`).join('');
    tip.innerHTML = `<b>${dfmt(t)}</b>` + rows.map(({ s, p }) => `<div><span><span class="swatch" style="background:var(${s.color})"></span> ${s.name}</span><span>${fmtN(p.v)}</span></div><div class="note" style="justify-content:flex-end">${p.src}</div>`).join('');
    tip.style.display = 'block';
    const left = x(t) / sx + 14;
    tip.style.left = (left + tip.offsetWidth > r.width ? x(t) / sx - tip.offsetWidth - 14 : left) + 'px';
    tip.style.top = '12px';
  });
  host.querySelector('#hit').addEventListener('mouseleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); dots.innerHTML = ''; });
}

function drawTable(series) {
  const dates = [...new Set(series.flatMap((s) => s.pts.map((p) => p.d)))].sort().reverse();
  document.getElementById('table').innerHTML = `<table><thead><tr><th>Date</th>${series.map((s) => `<th>${s.name}</th>`).join('')}</tr></thead><tbody>${
    dates.map((d) => `<tr><td>${d}</td>${series.map((s) => { const p = s.pts.find((q) => q.d === d); return `<td>${p ? `${fmtN(p.v)} <span class="note">${p.src}</span>` : '<span class="note">n/a</span>'}</td>`; }).join('')}</tr>`).join('')
  }</tbody></table>`;
}

render();
</script>
</body>
</html>
